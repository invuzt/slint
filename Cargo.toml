[package]
name = "cakru_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
slint = { version = "1.16", features = ["backend-android-activity-06"] }
log = "0.4"
android_logger = "0.13"

[build-dependencies]
slint-build = "1.16"

[package.metadata.android]
package = "com.cak.cakru"
label = "Cakru App"
build_targets = ["aarch64-linux-android"]
target_sdk_version = 30
min_sdk_version = 21
resources = "android-res"
icon = "@mipmap/ic_launcher"


[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
strip = true

[package.metadata.android.signing.release]
path = "temp.keystore"
keystore_password = "temp123"
key_alias = "temp"
key_password = "temp123"
