name: Build Cakru APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # Mengaktifkan cache tangguh untuk dependensi dan biner kargo
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # Mengunduh biner binstall langsung dari rilis GitHub resmi
    - name: Install cargo-binstall
      run: |
        WANTED_VERSION="v1.10.1"
        ARCH="x86_64-unknown-linux-musl"
        wget https://github.com/cargo-bins/cargo-binstall/releases/download/${WANTED_VERSION}/cargo-binstall-${ARCH}.tgz
        tar -xvf cargo-binstall-${ARCH}.tgz
        mv cargo-binstall ~/.cargo/bin/

    # Memasang cargo-apk dengan cepat
    - name: Install cargo-apk
      run: cargo binstall cargo-apk -y

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # PERBAIKAN: Pasang android-30 (kebutuhan internal cargo-apk) DAN android-34 (target aplikasi) bersamaan
    - name: Install NDK & Platforms
      run: |
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-30" "platforms;android-34" "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Create temporary keystore
      run: |
        keytool -genkey -v -keystore temp.keystore -alias temp -storepass temp123 -keypass temp123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Temp,O=Temp,C=US"

    - name: Build release APK
      run: cargo apk build --release

    - name: Remove unaligned APK
      run: rm -f target/release/apk/*-unaligned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cakru-app
        path: target/release/apk/*.apk
