name: Build Cakru APK Tiny

on:
  push:
    branches: [ main, cakrui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

    # Memasang cargo-ndk agar Rust tahu linker NDK yang tepat untuk Android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    # Kompilasi yang aman menggunakan cargo-ndk
    - name: Build Rust Library (aarch64)
      run: |
        cargo ndk --target aarch64-linux-android --android-ndk-home ${ANDROID_NDK_HOME} build --release
        mkdir -p android/app/src/main/jniLibs/arm64-v8a
        cp target/aarch64-linux-android/release/libcakru_app.so android/app/src/main/jniLibs/arm64-v8a/

    - name: Inject Minimal Gradle Files
      run: |
        cat << 'INNER_EOF' > android/build.gradle
        buildscript {
            repositories { google() ; mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
        }
        allprojects {
            repositories { google() ; mavenCentral() }
        }
        INNER_EOF

        cat << 'INNER_EOF' > android/settings.gradle
        include ':app'
        INNER_EOF

        cat << 'INNER_EOF' > android/app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android' version '1.9.22'
        }
        android {
            namespace 'com.cak.cakru'
            compileSdk 34
            defaultConfig {
                applicationId "com.cak.cakru"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        INNER_EOF

        mkdir -p android/app/src/main
        cat << 'INNER_EOF' > android/app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:label="Cakru Tiny"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        INNER_EOF

    - name: Build Android Release APK
      run: |
        cd android
        chmod +x gradlew || gradle wrapper
        ./gradlew assembleRelease

    - name: Upload Tiny APK
      uses: actions/upload-artifact@v4
      with:
        name: cakru-tiny-apk
        path: android/app/build/outputs/apk/release/*.apk
