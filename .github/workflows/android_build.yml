name: Build Cakru APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    # Mengaktifkan cache tangguh untuk dependensi dan biner kargo
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    # OPTIMASI: Pasang cargo-apk menggunakan binstall (unduh biner siap pakai, bukan compile dari awal)
    - name: Install cargo-apk
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install.sh | sh
        cargo binstall --deploy-ids cargo-apk -y

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # OPTIMASI: Selaraskan instalasi platform SDK ke API 34 sesuai Cargo.toml
    - name: Install NDK & Platform 34
      run: |
        ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "ndk;26.1.10909125"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Create temporary keystore
      run: |
        keytool -genkey -v -keystore temp.keystore -alias temp -storepass temp123 -keypass temp123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Temp,O=Temp,C=US"

    - name: Build release APK
      run: cargo apk build --release

    - name: Remove unaligned APK
      run: rm -f target/release/apk/*-unaligned.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: cakru-app
        path: target/release/apk/*.apk
